# _toc.yml — table of contents (becomes the sidebar navigation)
# Docs: https://jupyterbook.org/en/stable/structure/toc.html
#
# 'format: jb-book' = a linear, book-style read (intro, then chapters in order).
# 'root' is the landing page. 'chapters' are the ordered pages.
# 'title:' overrides a page's nav label (otherwise the page's first heading is
# used — which is why the notebook needs an explicit title here, or its first
# markdown header, "Define Class Labels", would become the tab name).

format: jb-book
root: intro                       # intro.md — the landing / overview page

chapters:
  - file: architecture            # architecture.md — the code & system design
  - file: basketball_training     # the notebook: data -> train -> eval -> infer
    title: Training Notebook
  - file: reproduce               # reproduce.md — how to run it yourself